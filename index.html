<body>
<div id="global-loader" style="position:fixed;top:0;left:0;height:3px;background:var(--primary);width:0%;z-index:99999;transition:width 0.2s ease,opacity 0.3s ease;box-shadow:0 0 10px var(--primary);opacity:0;pointer-events:none;"></div>
<div id="fatal-error" style="display:none;position:fixed;top:0;left:0;right:0;background:#DC2626;color:white;padding:20px;z-index:999999;font-family:monospace;font-size:14px;line-height:1.5;white-space:pre-wrap;"></div>
<div id="offline-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#EA580C;color:#fff;padding:6px 12px;font-size:13px;text-align:center;z-index:9998;font-family:system-ui,sans-serif;">You are offline.</div>
<div id="global-error" style="display:none;position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;padding:10px 12px;z-index:99999;font-family:monospace;font-size:12px;line-height:1.4;max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-all;transition:opacity .3s;"></div>
<div id="app" class="app-shell">
  <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
  <header id="topbar" class="topbar"></header>
  <main id="page" class="page" aria-live="polite"></main>
</div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
<div id="modal-root"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
(function(){
  // 1. KILL ALL SERVICE WORKERS
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) {
        registration.unregister();
        console.log('ServiceWorker unregistered. Cache destroyed.');
      } 
    });
  }

  var fatal = document.getElementById('fatal-error');
  window.addEventListener('error', function(e){
    fatal.style.display = 'block';
    fatal.textContent = 'CRITICAL ERROR: ' + (e.message || 'Unknown') + '\nFile: ' + (e.filename || 'Unknown');
  });
  
  var box = document.getElementById('global-error');
  var hideTimer = null;
  function show(msg){ box.textContent = msg; box.style.display = 'block'; box.style.opacity = '1'; if (hideTimer) clearTimeout(hideTimer); hideTimer = setTimeout(hide, 6000); }
  function hide(){ box.style.opacity = '0'; setTimeout(function(){ if (box.style.opacity === '0') { box.style.display = 'none'; box.textContent = ''; } }, 300); }
})();
</script>
<script type="module" src="./js/app.js?v=46"></script>
</body>
</html>
